<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pongal Greeting Card</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #ffd54f, #ff9800);
    }

    .card-container {
      position: relative;
      width: 300px;
      height: 400px;
      perspective: 1000px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: absolute;
      transform-style: preserve-3d;
      transform: rotateY(0deg);
      transition: transform 1s ease;
    }

    .card.open {
      transform: rotateY(180deg);
    }

    .card-side {
      width: 100%;
      height: 100%;
      position: absolute;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
    }

    .card-front {
      background: #dddcd9;
    }

    .card-front h1 {
      font-size: 1.5em;
      color: #4a2f1b;
      margin: 0;
    }

    .card-front p {
      font-size: 1em;
      color: #4a2f1b;
    }

    .card-back {
      background: #ff9800;
      color: white;
      transform: rotateY(180deg);
    }

    .card-back h1 {
      font-size: 1.8em;
      margin: 10px 0;
      animation: text-glow 2s infinite alternate;
    }

    .card-back p {
      font-size: 1em;
      text-align: center;
      padding: 10px;
    }

    @keyframes text-glow {
      0% {
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      }
      100% {
        text-shadow: 0 0 20px rgba(255, 255, 255, 1);
      }
    }

    .buttons {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .buttons button {
      padding: 10px 20px;
      font-size: 1em;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .buttons .open-btn {
      background: #4caf50;
    }

    .buttons .open-btn:hover {
      background: #45a049;
    }

    .buttons .close-btn {
      background: #f44336;
    }

    .buttons .close-btn:hover {
      background: #e53935;
    }

    @media (max-width: 768px) {
      .card-container {
        width: 80%;
        height: auto;
      }

      .card-front h1,
      .card-back h1 {
        font-size: 1.2em;
      }

      .card-front p,
      .card-back p {
        font-size: 0.9em;
      }

      .buttons button {
        padding: 8px 16px;
        font-size: 0.9em;
      }
    }
  </style>
</head>
<body>
  <div class="card-container">
    <div class="card" id="greeting-card">
      <!-- Front Side -->
      <div class="card-side card-front">
        <h1>Pongal Greetings!</h1>
        <p>Click to open your card 🎉</p>
      </div>
      <!-- Back Side -->
      <div class="card-side card-back">
        <h1 style="color: #4caf50;">From Rishikesh & Akash</h1>
        <h1> (Advance Happy Pongal! To All 🌾)</h1>
        <p>May this harvest festival bring happiness, prosperity, and joy to you and your family. 🎉</p>
        
      </div>
    </div>
  </div>

  <div class="buttons">
    <button class="open-btn" onclick="openCard()">Open</button>
    <button class="close-btn" onclick="closeCard()">Close</button>
  </div>

  <script>
    const card = document.getElementById('greeting-card');

    function openCard() {
      card.classList.add('open');
    }

    function closeCard() {
      card.classList.remove('open');
    }
  </script>
</body>
</html>
